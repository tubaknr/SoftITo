<body class="bg-surface-container-lowest text-on-surface antialiased min-h-screen flex flex-col justify-between selection:bg-primary selection:text-on-primary">

<h1 class="font-headline-md text-headline-md text-on-surface font-semibold tracking-tight">

</div>
<button aria-label="Kapat" class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high transition-colors active:scale-95 border border-outline-variant/30" onclick="window.history.back()" type="button">

<!-- Center Section: Countdown & Breathing Rhythm Sphere -->

<!-- 5-Minute Crisis Countdown -->
<div class="flex flex-col items-center mb-6">
<div class="flex items-center gap-1.5 text-on-surface-variant mb-1">
<span class="material-symbols-outlined text-sm text-secondary" data-icon="timer">timer</span>
<span class="font-label-caps text-label-caps uppercase">5 Dakikalık Kriz Geri Sayımı</span>
</div>

<span>04</span>
<span class="animate-pulse">:</span>
<span>38</span>
</div>
</div>
<!-- Concentric Interactive Breathing Guide -->
<div class="relative w-64 h-64 flex items-center justify-center">
<!-- Outer Static Ring Guide -->
<div class="absolute inset-0 rounded-full border border-outline-variant/30"></div>
<div class="absolute inset-4 rounded-full border border-secondary/20"></div>
<!-- Animated Pulsing Waves -->
<div class="absolute inset-0 rounded-full bg-secondary/10 transition-transform duration-1000 ease-in-out scale-90" id="pacer-wave"></div>
<!-- Central Resonant Node -->
<div class="w-44 h-44 rounded-full bg-surface-container border border-primary/30 breathing-glow flex flex-col items-center justify-center text-center p-4 relative z-20 transition-transform duration-1000 ease-in-out shadow-2xl" id="pacer-circle">
<span class="material-symbols-outlined text-primary mb-1 transition-transform" data-icon="air">air</span>
<span class="font-headline-md text-headline-md font-bold text-on-surface tracking-tight" id="breath-phase">Nefes Al</span>
<span class="font-label-metric text-headline-md text-secondary font-bold mt-0.5" id="breath-count">4 sn</span>

</div>

</button>

<button class="w-full py-3.5 px-4 rounded-full bg-gradient-to-r from-primary-container to-inverse-primary text-on-primary font-headline-md text-headline-md flex items-center justify-center gap-2 shadow-[0px_0px_24px_-4px_rgba(16,185,129,0.4)] hover:brightness-110 active:scale-[0.98] transition-all" onclick="celebrateVictory()" type="button">
<span class="material-symbols-outlined font-bold" data-icon="check_circle">check_circle</span>
<span>Krizi Yendim!</span>
</button>
</footer>

<!-- Interactive Breathing Micro-Engine & Realtime Timer -->
<script>
    // Breathing Cycle: 4s Breathe In, 4s Hold, 4s Breathe Out
    const phases = [
      { name: "Nefes Al", duration: 4, scale: 1.18, waveScale: 1.35, color: "text-primary" },
      { name: "Tut", duration: 4, scale: 1.18, waveScale: 1.35, color: "text-secondary" },
      { name: "Ver", duration: 4, scale: 0.95, waveScale: 0.85, color: "text-on-surface-variant" }
    ];

    let currentPhaseIndex = 0;
    let secondsLeftInPhase = 4;
    
    const phaseLabel = document.getElementById("breath-phase");
    const countLabel = document.getElementById("breath-count");
    const pacerCircle = document.getElementById("pacer-circle");
    const pacerWave = document.getElementById("pacer-wave");

    function runBreathingPacer() {
      const activePhase = phases[currentPhaseIndex];
      phaseLabel.innerText = activePhase.name;
      countLabel.innerText = secondsLeftInPhase + " sn";

      if (secondsLeftInPhase === activePhase.duration) {
        pacerCircle.style.transform = `scale(${activePhase.scale})`;
        pacerWave.style.transform = `scale(${activePhase.waveScale})`;
      }

      secondsLeftInPhase--;

      if (secondsLeftInPhase < 0) {
        currentPhaseIndex = (currentPhaseIndex + 1) % phases.length;
        secondsLeftInPhase = phases[currentPhaseIndex].duration;
      }
    }

    setInterval(runBreathingPacer, 1000);

    // Crisis 5-minute countdown simulation
    let totalSecondsRemaining = 278; // 04:38
    const timerDisplay = document.getElementById("timer-display");

    setInterval(() => {
      if (totalSecondsRemaining > 0) {
        totalSecondsRemaining--;
        const mins = String(Math.floor(totalSecondsRemaining / 60)).padStart(2, '0');
        const secs = String(totalSecondsRemaining % 60).padStart(2, '0');
        timerDisplay.innerHTML = `<span>${mins}</span><span class="animate-pulse">:</span><span>${secs}</span>`;
      }
    }, 1000);

    // Interactive button actions
    let soundEnabled = true;
    let vibeEnabled = true;

    function toggleControl(type) {
      if (type === 'sound') {
        soundEnabled = !soundEnabled;
        document.getElementById('sound-label').innerText = soundEnabled ? "Doğa Sesi: Açık" : "Doğa Sesi: Kapalı";
      } else {
        vibeEnabled = !vibeEnabled;
        document.getElementById('vibe-label').innerText = vibeEnabled ? "Titreşim: Aktif" : "Titreşim: Kapalı";
      }
    }

    function triggerSupportAction(action) {
      if (action === 'water') {
        alert("Harika! Su içmek ağızdaki reseptörleri canlandırır ve dopamin arayışını yatıştırır. Derin nefese devam et.");
      } else if (action === 'distract') {
        alert("Zihnini 1 dakika boyunca odadaki 5 mavi nesneyi saymaya odakla.");
      }
    }

    function celebrateVictory() {
      const circle = document.getElementById("pacer-circle");
      circle.classList.add("bg-primary-container", "text-on-primary-container");
      alert("Tebrikler! Bir atağı daha iraden ve ciğerlerin lehine kazandın. +10 Sağlık Puanı eklendi!");
    }
  </script>
