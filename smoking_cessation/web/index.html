<!DOCTYPE html>
<html>
<head>
  <!--

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="smoking_cessation">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>smoking_cessation</title>
  <link rel="manifest" href="manifest.json">
  <script>
    (function() {
      let audioCtx = null;
      let noiseNode = null;
      let isPlaying = false;

      function startNatureAudio() {
        if (isPlaying) return;
        try {
          if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          }
          if (audioCtx.state === 'suspended') {
            audioCtx.resume();
          }
          const bufferSize = audioCtx.sampleRate * 2;
          const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
          const data = buffer.getChannelData(0);
          let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
          for (let i = 0; i < bufferSize; i++) {
            const white = Math.random() * 2 - 1;
            b0 = 0.99886 * b0 + white * 0.0555179;
            b1 = 0.99332 * b1 + white * 0.0750759;
            b2 = 0.96900 * b2 + white * 0.1538520;
            b3 = 0.86650 * b3 + white * 0.3104856;
            b4 = 0.55000 * b4 + white * 0.5329522;
            b5 = -0.7616 * b5 - white * 0.0168980;
            data[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362) * 0.035;
            b6 = white * 0.115926;
          }
          noiseNode = audioCtx.createBufferSource();
          noiseNode.buffer = buffer;
          noiseNode.loop = true;

          const filter = audioCtx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.value = 650;

          const gain = audioCtx.createGain();
          gain.gain.setValueAtTime(0.25, audioCtx.currentTime);

          noiseNode.connect(filter);
          filter.connect(gain);
          gain.connect(audioCtx.destination);
          noiseNode.start();
          isPlaying = true;
        } catch(e) {
          console.warn('Nature audio error:', e);
        }
      }

      function stopNatureAudio() {
        if (!isPlaying) return;
        try {
          if (noiseNode) {
            noiseNode.stop();
            noiseNode.disconnect();
            noiseNode = null;
          }
        } catch(e) {}
        isPlaying = false;
      }

      let origTitle = document.title || 'smoking_cessation';
      const observer = new MutationObserver(function() {
        const title = document.title;
        if (title.indexOf('cmd:nature:play') !== -1) {
          startNatureAudio();
          document.title = origTitle;
        } else if (title.indexOf('cmd:nature:stop') !== -1) {
          stopNatureAudio();
          document.title = origTitle;
        } else if (title.indexOf('cmd:') === -1) {
          origTitle = title;
        }
      });
      const titleElem = document.querySelector('title');
      if (titleElem) {
        observer.observe(titleElem, { subtree: true, characterData: true, childList: true });
      }
    })();
  </script>
</head>

</html>
