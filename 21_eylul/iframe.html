<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iframe</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            background: khaki;
            padding: 20;
            max-width: 600;
            margin: auto;
        }

        .card {
            background-color: blueviolet;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 52px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 05);
        }

        h3 {
            margin-top: 0;
            color: #1e293b;
        }

        iframe {
            width: 100%;
            border-radius: 8px;
            border: none;
        }
    </style>
    <!--  0.05 = 05  rgba -->
</head>

<body>
    <div class="card">
        <iframe width="560" height="315" src="https://www.youtube.com/embed/__Z6OzfTwi8?si=OBB39WsvajySaugB"
            title="YouTube video player" frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        <br>

        <iframe
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d24176.232188736285!2d29.35979195131914!3d40.76138637457453!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x14cb4f80cf2e78e7%3A0xcf1bd532e3deff4b!2zQm9zY2ggWWV0a2lsaSBTYXTEsWPEsXPEsSAtIEFITUVUIFNFRkFPxJ5MVQ!5e0!3m2!1sen!2str!4v1789995786701!5m2!1sen!2str"
            width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"
            referrerpolicy="strict-origin-when-cross-origin"></iframe>

        <iframe
            src="https://www.kodusta.com"
            width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"
            referrerpolicy="strict-origin-when-cross-origin"></iframe>
    </div>

</body>

</html>
