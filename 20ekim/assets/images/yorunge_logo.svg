<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Gece) -->
    <radialGradient id="bgNight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#19214D" />
      <stop offset="80%" stop-color="#0F1535" />
      <stop offset="100%" stop-color="#0B0F28" />
    </radialGradient>

    <!-- Dawn Gradient (Şafak Amberi -> Mercan) -->
    <linearGradient id="dawnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB547" />
      <stop offset="100%" stop-color="#FF7A6B" />
    </linearGradient>

    <!-- Orbit Cyan Gradient -->
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4ADEDE" />
      <stop offset="100%" stop-color="#3DDC97" />
    </linearGradient>

    <!-- Rocket Body Gradient -->
    <linearGradient id="rocketBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#D7DCFA" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Circular Plate -->
  <circle cx="256" cy="256" r="236" fill="url(#bgNight)" stroke="#34407F" stroke-width="4" />
  <circle cx="256" cy="256" r="246" fill="none" stroke="#4ADEDE" stroke-width="2" stroke-opacity="0.35" filter="url(#glow)" />

  <!-- Stars -->
  <circle cx="120" cy="110" r="3" fill="#F3F5FF" opacity="0.8" />
  <circle cx="390" cy="130" r="3.5" fill="#F3F5FF" opacity="0.9" />
  <circle cx="85" cy="330" r="2" fill="#F3F5FF" opacity="0.6" />
  <circle cx="430" cy="360" r="3" fill="#F3F5FF" opacity="0.85" />
  <circle cx="170" cy="410" r="2.5" fill="#F3F5FF" opacity="0.7" />
  <circle cx="330" cy="95" r="2" fill="#F3F5FF" opacity="0.7" />

  <!-- Orbit Ring (Tilted Yörünge) -->
  <g transform="rotate(-28 256 256)">
    <ellipse cx="256" cy="256" rx="205" ry="68" fill="none" stroke="url(#orbitGrad)" stroke-width="7" stroke-dasharray="14 9" opacity="0.9" filter="url(#glow)" />
    <!-- Orbiting Golden Bead (Şafak Çekirdeği) -->
    <circle cx="435" cy="245" r="14" fill="url(#dawnGrad)" stroke="#FFFFFF" stroke-width="2" filter="url(#glow)" />
  </g>

  <!-- Rocket Component (Ascending 45 degrees) -->
  <g transform="translate(256, 256) rotate(45) translate(-256, -256)">
    <!-- Dawn Propulsion Flame -->
    <path d="M 235 320 Q 256 425 256 438 Q 256 425 277 320 Z" fill="url(#dawnGrad)" filter="url(#glow)" />
    <path d="M 244 320 Q 256 385 256 395 Q 256 385 268 320 Z" fill="#FFE59E" />

    <!-- Wings (Surface High) -->
    <path d="M 220 280 L 165 330 L 220 325 Z" fill="#232C63" stroke="#34407F" stroke-width="2" />
    <path d="M 292 280 L 347 330 L 292 325 Z" fill="#232C63" stroke="#34407F" stroke-width="2" />

    <!-- Rocket Body -->
    <path d="M 256 115 C 292 188 296 280 288 325 L 224 325 C 216 280 220 188 256 115 Z" fill="url(#rocketBody)" stroke="#34407F" stroke-width="2" />

    <!-- Dawn Nose Cap -->
    <path d="M 256 115 C 276 155 281 178 281 192 L 231 192 C 231 178 236 155 256 115 Z" fill="url(#dawnGrad)" />

    <!-- Porthole Window -->
    <circle cx="256" cy="235" r="22" fill="#4ADEDE" stroke="#19214D" stroke-width="4" filter="url(#glow)" />
    <circle cx="252" cy="230" r="13" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.85" />
  </g>
</svg>
