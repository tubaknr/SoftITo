<!DOCTYPE html>
<html lang="en">
<head>
    <!-- :root { --bg-sth: sth} TÜM SİTEDE ÇALIŞIR!!!! -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS3 Seçici & Değişkenler</title>
    <style>
        /* 1. UNIVERSAL - PUANI = 0. TÜM SİTEDE ÇALIŞIR!!  */
        :root{
            --brand-primary: #4f46e5;
            --brand-accent: #06b6d4;
            --bg-surface: #ffffff;
            --text-main: #0f172a;
            --radius-md: 12px;
        }
        /*
        DARK MODE:
        */
        @media (prefers-color-scheme: dark){
            :root{
                --bg-surface: #1e293b;
                --text-main: #f8fafc;
            }
        }

        /* 2. ELEMENT */
        body{
            font-family: 'Courier New', Courier, monospace;
            background-color: #f1f5f9;
            color: var(--text-main);
            padding: 24px;
        }

        /* 2. ELEMENT - PUANI = (0,0,0,1) = 1 */
        button{
            background-color: gray;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius:  var(--radius-md);
            font-size: 16px;
            cursor: pointer;
        }

        /* 3.CLASS - PUANI = (0,0,1,0) = 10 --> YUKARIDAKİ GRAY'İ EZER!
        Google da daha geride gözükürsün, ne kadar yavaş açıırsan o akdar geride çıakrsın.
        */
        .btn-action {
            background-color: var(--brand-primary);
        }

        /* Puan = (0,0,1,1) = 11 -> btn-action'ı EZER. */
        button.btn-action{
            box-shadow: 0 4px 14px rgba(79, 70, 229, 0.4); /* EKSİ PUAN, YUKARIYA YAZABİLİRDİN TEKRAR TEKRAR YAZIP EZMENE GERKE VAR MIYDI DER, İNDEKSLEMEN DÜŞER.*/
        }

        /* 4. ID SEÇİCİ - Puan (0,1,0,0) -> yukarıdaki tüm butonları ezer!!! */
        #submit-btn{
            background: linear-gradient(135deg, var(--brand-primary), var(--brand-accent));
        }

        /* 3. CLASS */
        .btn-action:hover{
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        /* 3. CLASS */
        .btn-action:active{
            transform: translateY(0);
        }
        
    </style>
</head>
<body>
    <h2>CSS Değişkenler</h2>
    <button id="submit-btn" class="btn-action">İşlemi Onayla</button>
</body> 
</html>
