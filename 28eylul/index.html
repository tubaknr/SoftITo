        const randevuOlustur = (danisanAdi, hizmet, uzmanMusaitMi) => {
            // resolve, reject gelene kadar hareket etmez Promise.
            return new Promise((resolve, reject) => {
                console.log(`${danisanAdi} için "${hizmet}" seansı sorgulanıyor.`);
                
                // buradaki tüm işlemler bittikten sonra resolve ile dönüş yapıyor, 
                // sonra than ile sonuc yazdırılıyor. 
                setTimeout(() => {
                    if (uzmanMusaitMi){
                        // true gelirse çalışacağı bölüm --> resolve
                        const randevuDetay = {
                            takipNo:"BİO-" + Math.floor(1000 + Math.random()*9000),
                            danisan: danisanAdi,
                            hizmet: hizmet,
                            saat: "14:30",
                            onaylandi: true
                        };
                        resolve(randevuDetay); 

                    } else {
                        // hata/uyarı verecekse çalışacağı bölüm 
                        reject(new Error("Seçilen saatte uzman randevusu doludur."));
                    }
                }, 5500); // 5.5 sn sonucu gecikmesi simülasyonu
            });
        }

        // BAŞINA ASYNC YAZILAN FUNC, OTOMATİK ARKADA PROMISE OLUR.
        // ARKADA OTOMATK İŞLEMLER BAŞLAR.
        // AWAIT GİRİLİRSE, KODU BEKLE DER, KOD GELİNCE EKRANA 
        // NORMAL KOD GİBİ EKRANA TESLİM EDER.

        const seansUcretiHesapla = (hizmetTipi) => {
            return new Promise((resolve) => {
                setTimeout(() => {
                    const tarifeler = {
                        "Lazer Epilasyon":2800,
                        "İğneli Epilasyon":4500,
                        "Lipo":6500
                    }
                    resolve(tarifeler[hizmetTipi] || 1500);
                }, 1000)
            })
        }; // Hata alma ihtimalin varsa REJECT kullan. 
        // Ama veriyi dışarı aktarma vs hata almaacağın bir şeyse REJECT
        //  kullanmak zorunda değilsin.

        const randevuSureciBasla = async (danisan, hizmet) => {
            try{
                console.log(`1. adım ${danisan} için işlem başlatılıyor...`);

                const randevu = await randevuOlustur(danisan, hizmet, true);
                console.log(`2.Adım RAndevu Onaylandı. Takip NO: ${randevu.takipNo}`);

                const tutar = await seansUcretiHesapla(hizmet);
                console.log(`3.adım sens ücreti: ${tutar} TL KDV dahildir. Kayıt Tamamlandı.`);

                return {basaili: true, takipNo: randevu.takipNo, toplam: tutar};

            } catch(err){
                console.error("Hata oluştu: ", err.message);
                return {basarili: false, hata: err.message};

            } finally{
                console.log("Seans Akışı Tamamlandı.");
            }
        }

        randevuSureciBasla("Meryem Tur", "Lipo");

    //Dışarıdan REST API olarak veri çekme

    const kozmetikUrunleriniGetir = async() => {
        try{
            console.log("Harici API'ye bağlanılıyor.");
            // DIŞARIDAN ÇEKİLECEK VERİ FETCH İLE ÇEKİLİR!!!!!!
            const response = await fetch("https://dummyjson.com/products/category/beauty");

            if (!response.ok){
                throw new Error(`Http Hatası: ${response.status}`);
            }

            const data = await response.json();
            console.log(`Toplam ${data.products.length} adet kozmetik ürün çekildi.`);

            const vitrin = data.products.slice(0,3)
            .map(p => ({
                urun: p.title,
                fiyat: p.price,
                stok: p.stock
            }));
            console.table(vitrin);
        }catch (err){
            console.warn("API Hatası", err.message);
        }
    }

// kozmetikUrunleriniGetir();

// fetch ile ürün seç, ilk gelen 1.se 2.ürünü kabul etme sonraki 5i al
// isim, açıklama, kategori, fiyat, stok, etiket
    const kozmetikUrunCek = async() => {
        try{
            const resp = await fetch("https://dummyjson.com/products");
            
            if(!resp.ok){
                throw new Error(`Http Hatası: ${resp.status}`);
            }

            const tumUrunler = await resp.json();

            const istenenUrunler = tumUrunler.products
             .slice(2,7)
             .map(p => ({
                urun: p.title,
                fiyat: p.price,
                aciklama: p.description,
                stok: p.stock,
                kategori: p.category,
                etiket: p.tags.join(",")
            }));
            console.table(istenenUrunler);
        } catch(err){
            console.warn("API Hatası", err.message);
        }
    }

kozmetikUrunCek();
