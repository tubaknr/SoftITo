<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobil Klavye Değişkenleri</title>
    <script></script>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            padding: 20px;
            background: #f8fafc;
            color: #0f172a;
            line-height: 1.5;
        }
        .form-group{
            margin-bottom: 16px;
        }
        label{
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 13px;
        }
        input{
            width: 100%;
            padding: 12px;
            border: 1.5px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            box-sizing: border-box;
        }
        input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3);
        }
        .hint{
            font-size: 11px;
            color: #64748b;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <!--
    T.C. Kimlik No: ^[1-9]{1}[0-9]{9}[02468]{1}$
    Türkiye Cep Telefonu: ^(+90|0)?5[0-9]{2}[0-9]{3}[0-9]{2}[0-9]{2}$
    Güçlü Şifre: ^(?=.[a-z])(?=.[A-Z])(?=.\d)(?=.[@$!%?&])[A-Za-z\d@$!%?&]{8,}$
    CVV Kodu: ^[0-9]{3}$
    -->
    <h3>Mobil Klavye Değişkenleri</h3>
    <form id="mobileForm" autocomplete="on">
        <div class="form-group">
            <label for="txtName">Ad Soyad (Otomatik Büyük Harf)</label>
            <input type="text" id="txtName" name="full_name" 
            placeholder="Tuba Aydın" autocomplete="name" 
            autocapitalize="words" enterkeyhint="next">
            <div class="hint"> autocapitalize="words" her kelimenin ilk harfini büyük yapar. </div>
        </div>

        <div class="form-group">
            <label for="txtEmail">E-posta (düzeltme kapalı)</label>
            <input type="email" id="txtEmail" name="email" 
            placeholder="tuba.aydin.contact@gmail.com" 
            autocomplete="email" autocapitalize="none" 
            enterkeyhint="next">
            <div class="hint">@ ve .com eklenir.</div>
        </div>

        <div class="form-group">
            <label for="txtCard">Kredi kartı numarası (sayısal tuş takımı)</label>
            <input type="text" id="txtCard" name="card_number"
            placeholder="1234 5678 9012 3456" 
            autocomplete="cc-number" inputmode="numeric" 
            maxlength="19" enterkeyhint="next">
            <div class="hint">inputmode="numeric" sayısal tuş takımını açar ok tuşlarının çıkarmaz</div>
        </div>

        <div class="form-group">
            <label for="txtAmount">Para transferi tutarı</label>
            <input type="text" id="txtAmount" name="amount" 
            placeholder="1.250,50" inputmode="decimal" 
            enterkeyhint="next">
            <div class="hint">Mobilde noktalı virgüllü ondalıklı sayı klavyesini açar.</div>
        </div>

        <div class="form-group">
            <label for="txtOtp">SMS Doğrulama Kodu</label>
            <input type="text" id="txtOtp" placeholder="123456" 
            inputmode="numeric" maxlength="6" 
            autocomplete="one-time-code"
            enterkeyhint="done">
            <div class="hint">Sms geldiğinde klavyede kodu doldur önerisi çıkar.</div>
        </div>

     

    </form>
</body>
</html>
